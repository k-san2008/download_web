<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Download</title>
  <style>
    :root { color-scheme: light dark; }
    body {
      margin: 24px;
      font-family: system-ui, sans-serif;
      font-size: 14px;
    }
  </style>
</head>
<body>
  <p>ダウンロードが自動的に開始されます...</p>

  <script>
    const fileUrl = './test.zip';
    const fileName = 'test.zip';
    const delayMs = 1500;

    const triggerDownload = () => {
      const a = document.createElement('a');
      a.href = fileUrl;
      a.download = fileName;
      document.body.append(a);
      a.click();
      a.remove();
    };

    window.addEventListener('DOMContentLoaded', () => {
      const link = document.getElementById('dl');
      link.href = fileUrl;
      link.download = fileName;
      link.addEventListener('click', (e) => {
        e.preventDefault();
        triggerDownload();
      });

      setTimeout(triggerDownload, delayMs);
    });
  </script>
</body>
</html>
<body>
  <p>開始されない場合は、<a href="test.zip" download="test.zip">こちらをクリック</a>してください。</p>
</body>
</html>
