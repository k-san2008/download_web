<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ダウンロード中...</title>
  <script>
    window.addEventListener('DOMContentLoaded', () => {
      const fileUrl = './sample.zip';
      const fileName = 'sample.zip';

      const a = document.createElement('a');
      a.href = fileUrl;
      a.download = fileName;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
    });
  </script>
</head>
<body>
  <p>ダウンロードが自動的に開始されます...</p>
  <p>開始されない場合は、<a href="./sample.zip" download="sample.zip">こちらをクリック</a>してください。</p>
</body>
</html>
